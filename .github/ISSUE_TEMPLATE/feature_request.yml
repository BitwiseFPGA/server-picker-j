name: Feature request
description: Suggest an idea for the app
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like the app to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: The problem it solves for you, or how you'd use it.
